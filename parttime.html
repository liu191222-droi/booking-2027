<style>
/* Layout: one working column — top bar, tabs, then a single tool surface per tab; wide grids scroll inside their own frame. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#f6f8f8; --ink:#17211f; --muted:#5b6966; --line:#d6dedc;
  --accent:#0d6656; --accent-ink:#ffffff; --accent-soft:#dcece8;
  --sun:#ec5a87; --sun-soft:#fde3eb; --sat:#83b86a; --sat-soft:#e5f1dd;
  --warn:#9a6212; --warn-soft:#f8ecd6; --ok:#2f7d4c; --ok-soft:#dff0e5; --danger:#b4363a;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211f; --surface-2:#1e2826; --ink:#e4ebe9; --muted:#97a6a2; --line:#2d3936;
  --accent:#4cb8a2; --accent-ink:#06211b; --accent-soft:#1d3833;
  --sun:#f07ba0; --sun-soft:#3d2230; --sat:#9ccb85; --sat-soft:#24331f;
  --warn:#e2b25c; --warn-soft:#3a2e18; --ok:#7fcf9b; --ok-soft:#1b3326; --danger:#f08084; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211f; --surface-2:#1e2826; --ink:#e4ebe9; --muted:#97a6a2; --line:#2d3936;
  --accent:#4cb8a2; --accent-ink:#06211b; --accent-soft:#1d3833;
  --sun:#f07ba0; --sun-soft:#3d2230; --sat:#9ccb85; --sat-soft:#24331f;
  --warn:#e2b25c; --warn-soft:#3a2e18; --ok:#7fcf9b; --ok-soft:#1b3326; --danger:#f08084; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.04em}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em}
.month{display:flex;align-items:center;gap:6px;margin-left:auto}
.month .lbl{font-weight:700;min-width:220px;text-align:center;font-size:24px;color:var(--accent);font-family:var(--f-num);letter-spacing:.02em}
@media (max-width:560px){.month{margin-left:0;width:100%;justify-content:center}.month .lbl{font-size:20px;min-width:0}}
.iconbtn{width:42px;height:42px;font-size:22px;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}

.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}

main.wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
.banner{padding:10px 14px;border-radius:var(--r);font-size:14px}
.banner.demo{background:var(--warn-soft);color:var(--warn)}
.banner.lock{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{margin:0;font-size:17px}
.panel h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=time],input[type=date],select{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 9px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f>input,label.f>select{color:var(--ink);font-size:15px}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.sent{background:var(--ok-soft);color:var(--ok)}
.pill.none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.mode{background:var(--accent-soft);color:var(--accent)}

/* who-am-i */
.me{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}
.me .stat{text-align:right}
.me .stat b{font-size:28px;display:block;line-height:1.1}
@media (max-width:560px){.me{grid-template-columns:1fr}.me .stat{text-align:left}}

/* tools */
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.tool small{color:var(--muted);font-size:11.5px}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.myshifts{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.modes{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.modes legend{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.mode-opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer}
.mode-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.mode-opt.dis{cursor:default}
.mode-opt.dis:not(.on){opacity:.55}
.mode-opt input{margin-top:4px;accent-color:var(--accent)}
#myNote{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px;color:var(--ink);font:inherit;resize:vertical}
.nnote{font-size:11.5px;color:var(--muted);max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.star{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);background:var(--accent-soft);color:var(--accent);font-size:13px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;z-index:1}
.star:hover{background:var(--accent);color:var(--accent-ink)}
.custom.picks{flex-direction:column;align-items:stretch}
.guide{background:var(--accent-soft);border-radius:9px;padding:10px 12px;font-size:14px;line-height:1.7}
.mvs{position:absolute;bottom:-8px;left:-6px;display:flex;gap:2px;z-index:1}.mv{height:18px;min-width:20px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:12px;font-weight:700;line-height:1;padding:0 5px;cursor:pointer}.mv:hover{border-color:var(--accent)}
.ed{position:absolute;bottom:-8px;right:-6px;height:18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:10.5px;line-height:1;padding:0 6px;cursor:pointer;z-index:1}
.ed:hover{border-color:var(--accent)}
.tool.mine{padding-bottom:10px}
.tgroup{display:flex;flex-direction:column;gap:8px}
.mytag{font-style:normal;font-size:10.5px;color:var(--accent);font-weight:700;margin-top:1px}
.def{display:inline-block;margin-left:6px;font-size:11px;color:var(--accent);font-weight:700}
.modes legend .small{color:var(--muted)}
.mslbl{font-weight:700;font-size:14px}
.mslbl small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12.5px}
.toolwrap{position:relative}
.tool.mine{border-style:solid;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
div.tool.mine{cursor:default}
.tool.add{border-style:dashed;color:var(--accent)}
.x.armed{width:auto;padding:0 6px;border-radius:99px}
.tool.off-R,.tool.off-F{flex-direction:row;gap:6px;align-items:center}
.custom{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px;border-radius:9px;background:var(--surface-2)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:12px;text-align:center;color:var(--muted);font-weight:500}
.cal .dh.sun{color:var(--sun)} .cal .dh.sat{color:var(--sat)}
.day{min-height:78px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0}
.day{position:relative}
.day.live{cursor:pointer}
.day.live:hover{border-color:var(--accent)}
.day:not(.live){cursor:default}
.x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);background:var(--danger);color:#fff;font-size:10px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;z-index:1}
.x:hover{transform:scale(1.12)}
.capof{font-size:15px;color:var(--muted)}
.capbar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.capbar span{display:block;height:100%;background:var(--accent)}
.capbar.full span{background:var(--danger)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.tot.over{color:var(--danger);font-weight:700}
.day:disabled{cursor:default}
.day.nowk{background:var(--surface-2);border-style:dashed;opacity:.6}
.day.hol{background:#e53935;border-color:#e53935;border-style:solid;opacity:1;color:#fff}.day.hol .dn{color:#fff;font-weight:700}.day .hn{font-size:11.5px;font-weight:700;line-height:1.2}
table.plan th.hol{background:#e53935;color:#fff}table.plan td.hol{background:#f8b4b2}
.day,.cellbtn{user-select:none;-webkit-user-select:none}
.day.anchor,.cellbtn.anchor{box-shadow:inset 0 0 0 2px var(--warn)}
.hint{font-size:12.5px;color:var(--muted)}
.hint kbd{font-family:var(--f-num);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2)}
.day .dn{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.day.sun .dn{color:var(--sun)} .day.sat .dn{color:var(--sat)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.blank{visibility:hidden}
.chip{border-radius:6px;padding:3px 6px;font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.w{background:var(--accent-soft);color:var(--ink)}
.chip.w.mgr{background:var(--surface-2);border:1px dashed var(--line)}
.chip.R,.chip.OFF{background:var(--sun-soft);color:var(--sun);font-weight:700}
.chip.OFF.auto{background:transparent;border:1px dashed var(--sun);font-weight:500}
.chip.F{background:var(--sat-soft);color:var(--ok);font-weight:700}
.chip .h{font-family:var(--f-num);opacity:.75}
@media (max-width:560px){.day{min-height:62px;padding:4px}.chip{font-size:11px;padding:2px 3px}.chip .t{display:none}}

/* plan grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.plan{border-collapse:separate;border-spacing:0;font-size:13px}
table.plan th,table.plan td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
table.plan td{position:relative}
.cx{position:absolute;top:1px;right:1px;width:15px;height:15px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:8px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;opacity:0;z-index:1}
td:hover>.cx,.cx:focus-visible{opacity:1}
@media (hover:none){.cx{opacity:1}}
.linkbtn{border:0;background:none;color:var(--danger);font-size:12px;padding:0;cursor:pointer;text-decoration:underline}
.linkbtn.armed{font-weight:700}
.panel.has-x{position:relative;padding-right:52px}
.px{position:absolute;top:12px;right:12px;height:30px;min-width:30px;border-radius:99px;border:0;background:var(--danger);color:#fff;font-size:14px;cursor:pointer;padding:0 9px;font-weight:700}
.px.armed{font-size:12.5px}
table.plan thead th{background:var(--surface-2);font-weight:500;padding:4px 0;position:sticky;top:0}
table.plan .nm{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:6px 10px;min-width:150px}
table.plan thead .nm{z-index:2;background:var(--surface-2)}
table.plan .dcol{width:38px;min-width:38px}
table.plan th.sun{color:var(--sun)} table.plan th.sat{color:var(--sat)}
table.plan td.sun{background:color-mix(in srgb,var(--sun-soft) 55%,transparent)}
table.plan td.sat{background:color-mix(in srgb,var(--sat-soft) 55%,transparent)}
.cellbtn{width:100%;height:40px;border:0;background:transparent;cursor:pointer;font-size:12.5px;padding:0}
.cellbtn:hover{background:var(--accent-soft)}
.cellbtn.closed{display:grid;place-items:center;cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--line) 70%,transparent) 5px 6px)}
.cellbtn.closed:hover{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--line) 70%,transparent) 5px 6px)}
.cellbtn .R,.cellbtn .OFF{color:var(--sun);font-weight:700;font-size:11px} .cellbtn .F{color:var(--ok);font-weight:700}
.cellbtn .w{font-weight:700} .cellbtn .w small{display:block;font-family:var(--f-num);font-weight:500;color:var(--muted);font-size:10.5px}
table.plan .tot{min-width:64px;padding:0 8px;font-family:var(--f-num)}
.nm .sub{display:flex;gap:4px;margin-top:2px}

/* report sheet: replica of the paper form, deliberately paper-coloured in both themes */
.sheetwrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff}
.sheet{background:#fff;color:#000;padding:14px 16px 20px;min-width:1140px;font-family:"PMingLiU","MingLiU","Noto Serif TC",serif;font-size:11px}
.sheet .hd{display:grid;grid-template-columns:200px 1fr 260px;align-items:end}
.sheet .hd .t{text-align:center;font-size:17px;font-weight:700;letter-spacing:.05em}
.sheet .hd .note{color:#d0021b;text-align:right;font-size:10.5px}
.sheet table{border-collapse:collapse;width:100%;margin-top:4px;table-layout:fixed}
.sheet th,.sheet td{border:1px solid #000;text-align:center;padding:0;font-weight:400;color:#000}
.sheet thead th{height:22px;font-size:10.5px}
.sheet tbody td{height:44px;font-size:12px}
.sheet .wk0{background:#ff6f9c} .sheet .wk6{background:#c6e0b4} .sheet .nod{background:#bfbfbf}
.sheet .dt{color:#c00}
.sheet td.off{font-size:9px;letter-spacing:-.02em}
.sheet .notes td{text-align:left;padding:6px 8px;height:auto;font-size:11px;line-height:1.7}
.sheet .sign{display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;font-size:15px}

/* settings */
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td input[type=text]{width:100%}
.tbl .w-s{width:64px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;max-width:440px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.modal h3{margin:0;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>

  const path=p=>{const i=p.indexOf('/');return PCOL[p.slice(0,i)]+p.slice(i)};

}
const DL={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}};

  tab:'mine',tool:null,anchor:null,draft:null,myShifts:{},addShift:null,custom:{st:'09:00',en:'13:00',brk:0},me:'',fill:{shift:'',skipWk:true},unsubSched:null};

function ymOf(y,m){return y+'-'+String(m).padStart(2,'0')}
function ymParts(ym){const[a,b]=ym.split('-').map(Number);return{y:a,m:b}}
function dim(ym){const{y,m}=ymParts(ym);return new Date(y,m,0).getDate()}
function dow(ym,d){const{y,m}=ymParts(ym);return new Date(y,m-1,d).getDay()}
function roc(ym){const{y,m}=ymParts(ym);return (y-1911)+'年'+m+'月'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toMin(t){const[a,b]=(t||'0:0').split(':').map(Number);return a*60+b}
function hrs(st,en,brk){let m=toMin(en)-toMin(st);if(m<=0)m+=1440;m-=Number(brk)||0;return Math.max(0,Math.round(m/60*100)/100)}
function fmtH(h){return (Math.round(h*100)/100).toString()}
const cfg=()=>S.config||DEFAULT_CONFIG;
/* 常用班別的時間：由左往右輸入（第一個數字在十位數），自動補冒號；離開欄位時調整為整點或半點 */
function fmtTyping(v){let d=String(v||'').replace(/\D/g,'');if(d.length>4)d=d.slice(4,8);/* 欄位已滿又繼續輸入：從頭重新輸入 */return d.length>2?d.slice(0,2)+':'+d.slice(2):d}
function normTime(v){let d=String(v||'').replace(/\D/g,'');if(!d)return '';if(d.length<=2)d=d.padStart(2,'0')+'00';else if(d.length===3)d='0'+d;
  let h=+d.slice(0,2),m=+d.slice(2,4);if(h>23||m>59)return '';if(m<15)m=0;else if(m<45)m=30;else{m=0;h=(h+1)%24}
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
const myShifts=sid=>(S.myShifts[sid]||[]);
const shiftById=(id,sid)=>cfg().shifts.find(s=>s.id===id)||(sid?myShifts(sid):Object.values(S.myShifts).flat()).find(s=>s.id===id);
const locked=()=>!!(cfg().locked||{})[S.ym];
/* 兼職人員名單＝預約系統「後台管理 → 帳號管理」中類別為「兼職藥師」的人；ptstaff 只存每人的時薪／領照日／在職設定（以員工代號對應） */
function buildStaff(){const src=HOST&&HOST.ptStaff?HOST.ptStaff():[],set=S.ptset||[];
  return src.map(p=>{const code=String(p.code),x=set.find(d=>String(d.code||'').trim()===code)||{};
    return{id:x.id||code,code,name:p.name,lic:x.lic||'yes',licDate:x.licDate||'',active:x.active!==false}})}
const activeStaff=()=>S.staff.filter(s=>s.active!==false).sort((a,b)=>(a.code||'').localeCompare(b.code||'')||(a.name||'').localeCompare(b.name||''));
const entry=(sid,d)=>{if(S.draft&&S.draft.sid===sid&&S.draft.ym===S.ym)return S.draft.days['d'+d]||null;const doc=S.sched[sid];return doc?doc['d'+d]||null:null};
function isBefore(st,d){ // hours paid at pre-license rate?
  if(st.lic==='no')return true;
  if(st.lic==='date'&&st.licDate){return S.ym+'-'+String(d).padStart(2,'0')<st.licDate}
  return false;

function totals(st){
  let before=0,after=0,R=0,F=0;
  for(let d=1;d<=dim(S.ym);d++){const e=entry(st.id,d);if(!e)continue;
    if(e.t==='w'){isBefore(st,d)?before+=e.h:after+=e.h}else if(e.t==='R'||e.t==='OFF')R++;else if(e.t==='F')F++;}

}

  db.doc('config/main').onSnapshot(s=>{S.config=s.exists?Object.assign({},DEFAULT_CONFIG,s.data()):null;gotC=true;done()},fail);
  db.collection('myshifts').onSnapshot(q=>{const o={};q.docs.forEach(d=>{const v=d.data();o[d.id]=Array.isArray(v.shifts)?v.shifts:[]});S.myShifts=o;render()},()=>{});
  db.collection('staff').onSnapshot(q=>{S.ptset=q.docs.map(d=>Object.assign({id:d.id},d.data()));S.staff=buildStaff();gotS=true;done()},fail);

async function saveDays(sid,patch,status){

/* ---------- 我的班表 ---------- */
// Staff edits stay in a local draft until 暫存 / 送出.
function hasDraft(sid){return !!(S.draft&&S.draft.sid===sid&&S.draft.ym===S.ym)}
const MODES={off:'1. 只選 OFF，其餘天數由主管排班',self:'2. 自排 OFF＋上班日期及時數'};
function effMode(st){return 'self'}
function ensureDraft(sid){if(!hasDraft(sid)){const days={},doc=S.sched[sid];for(let d=1;d<=dim(S.ym);d++){days['d'+d]=doc&&doc['d'+d]||null}S.draft={sid,ym:S.ym,days,note:doc&&doc.note||'',mode:doc&&doc.mode||''}}return S.draft.days}
function draftPatch(){const p={note:S.draft.note||''};if(S.draft.mode)p.mode=S.draft.mode;for(let d=1;d<=dim(S.draft.ym);d++)p['d'+d]=S.draft.days['d'+d]||null;return p}
async function flushDraft(status){
  if(!S.draft)return true;const{sid,ym}=S.draft;
  if(ym!==S.ym)return true;
  const ok=await saveDays(sid,draftPatch(),status);if(ok)S.draft=null;render();return ok;
}
const cap=()=>Number(cfg().monthCap)||0;
function hoursWith(st,patch){let h=0;for(let d=1;d<=dim(S.ym);d++){const k='d'+d,e=k in patch?patch[k]:entry(st.id,d);if(e&&e.t==='w')h+=e.h}return Math.round(h*100)/100}
// When scheduled hours reach the monthly cap, every empty weekday becomes OFF (marked auto);
// if hours drop below the cap again, those auto OFFs are removed.
function autoOffPatch(st,patch){
  const c=cap(),n=dim(S.ym),get=d=>{const k='d'+d;return k in patch?patch[k]:entry(st.id,d)};
  let h=0;for(let d=1;d<=n;d++){const e=get(d);if(e&&e.t==='w')h+=e.h}
  const full=c&&h>=c-1e-9,out={};
  for(let d=1;d<=n;d++){const e=get(d);
    if(full){if(!e&&dayOpen(d))out['d'+d]={t:'OFF',auto:true}}
    else if(e&&e.t==='OFF'&&e.auto)out['d'+d]=null}
  return out;
}
function withAutoOff(st,patch){const extra=autoOffPatch(st,patch),added=Object.values(extra).filter(Boolean).length;Object.assign(patch,extra);
  if(added)setTimeout(()=>toast(`已達 ${cap()} 小時，其餘 ${added} 個空白日自動帶出 OFF`),50);return patch}
function overCap(st,patch){const c=cap();if(!c)return false;const after=hoursWith(st,patch);if(after>c&&after>hoursWith(st,{})){toast(`超過每月上限 ${c} 小時（套用後會是 ${fmtH(after)} 小時）`);return true}return false}

function viewMine(){

  const own=list.find(s=>String(s.code||'').trim()===myCode());
  if(!S.admin)S.me=own?own.id:'';else if(!list.some(s=>s.id===S.me))S.me=own?own.id:'';
  const me=list.find(s=>s.id===S.me);

    <select id="meSel"><option value="">選擇人員</option>${list.map(s=>`<option value="${s.id}" ${s.id===S.me?'selected':''}>${esc(s.code)}　${esc(s.name)}</option>`).join('')}</select></label>`:`<div><span class="muted small">我是</span><div style="font-size:18px;font-weight:700">${esc(me.code)}　${esc(me.name)}</div></div>`}`;
  if(me){const t=totals(me),doc=S.sched[me.id],c=cap(),pct=c?Math.min(100,t.hours/c*100):0;
    h+=`<div class="stat"><span class="muted small">本月排班時數</span><b class="num">${fmtH(t.hours)}${c?`<span class="capof"> / ${c}</span>`:''}</b><span class="small muted">OFF ${t.R} 天</span></div></div>
    ${c?`<div class="capbar ${t.hours>=c?'full':''}" role="progressbar" aria-valuemin="0" aria-valuemax="${c}" aria-valuenow="${t.hours}"><span style="width:${pct}%"></span></div>`:''}
    <div class="row">${statusPill(doc)}${hasDraft(me.id)?'<span class="pill draft">有未暫存的變更</span>':''}</div>`;
  }else h+=`</div>`;

  h+=`<section class="panel ${ro?'':'has-x'}">${ro?'':`<button class="px" data-act="clearAll" data-label="✕" title="全部清除" aria-label="全部清除">✕</button>`}<h2>${esc(cfg().staffTitle||'排 OFF 與上班日')}<small>${sent?'已送出；如需調整，直接修改後再按「送出」':esc(cfg().staffSub||'')}</small></h2>${cfg().staffGuide?`<div class="guide">${esc(cfg().staffGuide).replace(/\n/g,'<br>')}</div>`:''}`;
  if(!ro)h+=toolsHtml(effMode(me),me.id);

  h+=`<label class="f">備註<textarea id="myNote" rows="2" maxlength="300" placeholder="例如：11/20 下午要上課、希望集中排早班…" ${ro?'readonly':''}>${esc(note)}</textarea></label>`;

  else h+=`<button class="btn danger" data-act="clearAll" data-label="全部清除">全部清除</button><div class="row"><button class="btn" data-act="saveDraft" ${hasDraft(me.id)?'':'disabled'}>暫存</button><button class="btn primary" data-act="submit">送出</button></div>`;
  h+=`</div></section>`;
  return h;
}
function meRO(me){return locked()}
function statusPill(doc){if(!doc)return `<span class="pill none">尚未填寫</span>`;return doc.status==='sent'?`<span class="pill sent">已送出</span>`:`<span class="pill draft">暫存中</span>`}

/* 醫院公休日（預約系統後台「全年度行事曆」）：底色紅色，兼職藥師不能排上班 */
function holOf(d){const ds=S.ym+'-'+String(d).padStart(2,'0'),l=HOST&&HOST.holidays?HOST.holidays():[];return (l||[]).find(x=>x.d===ds)||null}
const isHolOff=d=>{const h=holOf(d);return !!(h&&h.t==='off')};
function dayOpen(d){const w=dow(S.ym,d);return w!==0&&w!==6&&!isHolOff(d)}
function weekCheck(me){
  return '';
  const n=dim(S.ym);let miss=[];
  for(let d=1;d<=n;){const w=dow(S.ym,d);const end=Math.min(n,d+(6-w));let r=false,f=false;
    for(let k=d;k<=end;k++){const e=entry(me.id,k);if(e&&(e.t==='R'||e.t==='OFF'))r=true;}
    if(end-d>=6&&!r)miss.push(`${d}–${end}日`);d=end+1;}
  return miss.length?`提醒：${miss.join('、')} 這週還沒有排 OFF`:'';
}
function rangeDays(a,b,filter){const lo=Math.min(a,b),hi=Math.max(a,b),out=[];for(let d=lo;d<=hi;d++)if(!filter||filter(d))out.push(d);return out}
function applyDay(me,d,shift){
  if(!S.tool){toast(effMode(me)==='off'?'先選上方的「OFF 排休」':'先選上方的班別');return}
  const isRange=shift&&S.anchor&&S.anchor.sid===me.id&&S.anchor.d!==d;
  const days=isRange?rangeDays(S.anchor.d,d,dayOpen):[d];
  let base;
  if(S.tool==='OFF'||S.tool==='F')base={t:S.tool};
  else if(S.tool==='custom'){const c=S.custom;base={t:'w',s:null,code:'自訂',st:c.st,en:c.en,h:hrs(c.st,c.en,c.brk)}}
  else{const sh=shiftById(S.tool.slice(2),me.id);if(!sh)return;base=shiftEntry(sh)}
  const patch={};
  days.forEach(k=>{const cur=entry(me.id,k);let val=base;
    if(!isRange&&cur&&cur.t===base.t&&(base.t!=='w'||cur.s===base.s))val=null; // tap again = toggle off
    if(effMode(me)==='off'&&cur&&cur.t==='w'&&val===null)return;
    patch['d'+k]=val});
  if(overCap(me,patch))return;
  withAutoOff(me,patch);
  const dd=ensureDraft(me.id);Object.assign(dd,patch);S.anchor={sid:me.id,d};render();
  if(isRange)toast(`已套用 ${Object.keys(patch).length} 天，記得暫存或送出`);
}
function removeDay(me,d){const cur=entry(me.id,d);if(cur&&cur.auto){toast(`已達 ${cap()} 小時上限，空白日固定為 OFF；先刪掉一個班才能改`);return}const p=withAutoOff(me,{['d'+d]:null});Object.assign(ensureDraft(me.id),p);render()}

}

      const tt=st?totals(st):{before:0,after:0,amount:0};
      row.getCell(1).value=st?st.code:'';row.getCell(2).value=st?st.name:'';
      for(let d=1;d<=31;d++){const cell=row.getCell(2+d);
        if(d>n){cell.fill=fill('FFBFBFBF')}else{const w=dow(S.ym,d);if(w===0)cell.fill=fill('FFFF6F9C');if(w===6)cell.fill=fill('FFC6E0B4');
          const e=st?entry(st.id,d):null;if(e)cell.value=e.t==='w'?e.h:e.t;}}
      row.getCell(34).value=tt.before;row.getCell(35).value=tt.after;
      row.getCell(36).value={formula:`AH${r}*${c.rateBefore}+AI${r}*${c.rateAfter}`,result:tt.amount};row.getCell(36).numFmt='#,##0';
      for(let i=1;i<=37;i++){const cell=row.getCell(i);cell.border=box;cell.font=font;cell.alignment={horizontal:'center',vertical:'middle'}}});
    const nr=5+rows.length;ws.mergeCells(`A${nr}:B${nr}`);ws.getCell(`A${nr}`).value='說明：';
    ws.mergeCells(`C${nr}:AK${nr}`);ws.getCell(`C${nr}`).value=c.notes.map((x,i)=>`${i+1}. ${x}`).join('\n');
    ws.getRow(nr).height=16*c.notes.length+10;
    for(let i=1;i<=37;i++){const cell=ws.getCell(nr,i);cell.border=box;cell.font=font;cell.alignment={vertical:'middle',wrapText:true,horizontal:i<3?'center':'left'}}
    const sr=nr+2,pos=[1,12,22,31];c.signers.forEach((s,i)=>{const cell=ws.getCell(sr,pos[i]||1+i*9);cell.value=s+'：';cell.font={name:'新細明體',size:13}});
    const buf=await wb.xlsx.writeBuffer();
    await S.dl.save({filename:`${roc(S.ym)}${c.title}.xlsx`,data:new Blob([buf])});
    toast('已匯出');
  }catch(e){if(e&&e.code==='declined'){}else toast((e&&e.message)||'匯出失敗')}
  btn.disabled=false;btn.textContent='匯出 Excel';
}

/* ---------- 設定 ---------- */
function viewSetup(){
  const c=cfg();
  let h=`<section class="panel"><h2>常用班別<small>員工與主管排班時可直接點選</small></h2><div class="tbl"><table id="shiftTbl"><thead><tr><th>簡稱</th><th>名稱</th><th>上班</th><th>下班</th><th>休息（分）</th><th>時數</th><th></th></tr></thead><tbody>`;
  c.shifts.forEach((s,i)=>{h+=`<tr data-i="${i}" data-id="${s.id}"><td><input type="text" class="w-s" name="code" value="${esc(s.code)}" maxlength="2" id="sc${i}"></td><td><input type="text" name="name" value="${esc(s.name)}" id="sn${i}"></td><td><input type="time" name="start" value="${s.start}" id="ss${i}"></td><td><input type="time" name="end" value="${s.end}" id="se${i}"></td><td><input type="number" name="brk" value="${s.brk||0}" min="0" step="10" style="width:80px" id="sb${i}"></td><td class="num">${fmtH(hrs(s.start,s.end,s.brk))}</td><td><button class="btn danger" data-act="rmShift" data-i="${i}">刪除</button></td></tr>`});
  h+=`</tbody></table></div><div class="row"><button class="btn" data-act="addShift">新增班別</button><button class="btn primary" data-act="saveShifts">儲存班別</button><span class="small muted">已排好的班不會因修改班別而變動。</span></div>
    <span class="small muted">系統規定：人員不可排週六、週日；主管排班不受限制。</span></section>`;

  const list=S.staff.slice().sort((a,b)=>(a.code||'').localeCompare(b.code||''));
  h+=`<section class="panel"><h2>兼職人員<small>名單來自「後台管理 → 帳號管理」中類別為「兼職藥師」的人</small></h2><div class="tbl"><table><thead><tr><th>員工代號</th><th>姓名</th><th>時薪</th><th>領照日</th><th>在職</th><th></th></tr></thead><tbody>`;
  const rowH=(s,k)=>`<tr data-sid="${s?s.id:''}"><td class="num">${esc(s.code)}</td><td>${esc(s.name)}</td>
    <td><select name="lic" id="pl${k}"><option value="yes" ${!s||s.lic==='yes'?'selected':''}>已領照 ${c.rateAfter}</option><option value="no" ${s&&s.lic==='no'?'selected':''}>未領照 ${c.rateBefore}</option><option value="date" ${s&&s.lic==='date'?'selected':''}>本月領照（依日期）</option></select></td>
    <td><input type="date" name="licDate" value="${s&&s.licDate||''}" id="pd${k}"></td><td><input type="checkbox" name="active" ${!s||s.active!==false?'checked':''} id="pa${k}"></td>
    <td style="white-space:nowrap"><button class="btn primary" data-act="saveStaff">儲存</button></td></tr>`;
  list.forEach((s,i)=>h+=rowH(s,i));if(!list.length)h+=`<tr><td colspan="6" class="muted">目前沒有類別為「兼職藥師」的員工，請到預約系統「後台管理 → 帳號管理」設定類別。</td></tr>`;
  h+=`</tbody></table></div><span class="small muted">要新增或移除兼職人員、修改姓名，請到預約系統「後台管理 → 帳號管理」修改類別或姓名；這裡只設定時薪、領照日與是否在職。</span><span class="small muted">「本月領照」：領照日之前的時數以 ${c.rateBefore} 元計，當天起以 ${c.rateAfter} 元計。取消「在職」可隱藏人員但保留紀錄。</span></section>`;

  h+=`<section class="panel"><h2>人員畫面文字<small>員工排班區塊的標題與說明</small></h2><div class="cards2">
    <label class="f">標題<input type="text" id="cfSTitle" value="${esc(c.staffTitle||'')}" maxlength="30"></label>
    <label class="f">副標題<input type="text" id="cfSSub" value="${esc(c.staffSub||'')}" maxlength="80"></label></div>
    <label class="f">排班說明（顯示在標題下方，每行一點，可留空）<textarea id="cfSGuide" rows="4" placeholder="例如：&#10;每月 25 號前送出下個月班表&#10;每週至少排 1 天 OFF" style="border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px;color:var(--ink);font:inherit">${esc(c.staffGuide||'')}</textarea></label>
    <div class="row"><button class="btn primary" data-act="saveStaffText">儲存人員畫面文字</button><button class="btn" data-act="resetStaffText">恢復預設文字</button></div></section>`;
  h+=`<section class="panel"><h2>申請表資訊</h2><div class="cards2">
    <label class="f">部門名稱<input type="text" id="cfDept" value="${esc(c.deptName)}"></label>
    <label class="f">部門代號<input type="text" id="cfCode" value="${esc(c.deptCode)}"></label>
    <label class="f">表單名稱<input type="text" id="cfTitle" value="${esc(c.title)}"></label>
    <label class="f">領照前時薪<input type="number" id="cfR1" value="${c.rateBefore}"></label>
    <label class="f">領照後時薪<input type="number" id="cfR2" value="${c.rateAfter}"></label>
    <label class="f">每人每月時數上限（0 = 不限）<input type="number" id="cfCap" min="0" value="${c.monthCap??100}"></label>
    <label class="f">右上角填表說明<input type="text" id="cfHead" value="${esc(c.headNote)}"></label></div>
    <label class="f">表尾說明（每行一點）<textarea id="cfNotes" rows="4" style="border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px;color:var(--ink);font:inherit">${esc(c.notes.join('\n'))}</textarea></label>
    <label class="f">簽核欄（以、分隔）<input type="text" id="cfSign" value="${esc(c.signers.join('、'))}"></label>
    <div class="row"><button class="btn primary" data-act="saveCfg">儲存申請表資訊</button></div></section>`;
  return h;
}
function readShifts(){
  return [...document.querySelectorAll('#shiftTbl tbody tr')].map(tr=>{const g=n=>tr.querySelector(`[name=${n}]`).value;
    return{id:tr.dataset.id,code:g('code').trim()||'班',name:g('name').trim()||'未命名',start:g('start')||'08:00',end:g('end')||'12:00',brk:Number(g('brk'))||0}});
}

/* ---------- modal / toast ---------- */
function arm(b,txt){if(b.classList.contains('armed'))return true;b.classList.add('armed');b.textContent=txt;setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=b.dataset.label||''}},3000);return false}
function emptyPatch(){const p={};for(let d=1;d<=dim(S.ym);d++)p['d'+d]=null;return p}
let modalCtx=null;
function modal(html,ctx){modalCtx=ctx;document.getElementById('layer').innerHTML=`<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){modalCtx=null;document.getElementById('layer').innerHTML=''}
let tt;function toast(m){clearTimeout(tt);let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2400)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.day[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true,shiftKey:e.shiftKey}))}});

/* ---------- events ---------- */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='meSel'){if(S.draft){flushDraft().then(()=>toast('已自動暫存剛才的變更'))}S.anchor=null;S.me=t.value;try{localStorage.setItem('pt-me',S.me)}catch(_){}render()}
  if(t.id==='cSt'||t.id==='cEn'||t.id==='cBrk'){S.custom={st:document.getElementById('cSt').value,en:document.getElementById('cEn').value,brk:Number(document.getElementById('cBrk').value)||0};render()}
  if(t.classList&&t.classList.contains('tm'))t.value=normTime(t.value);
  if(['psSt','psEn','psBrk','psName'].includes(t.id)&&S.addShift){S.addShift={editId:S.addShift.editId,orig:S.addShift.orig,name:document.getElementById('psName').value,st:normTime(document.getElementById('psSt').value)||document.getElementById('psSt').value,en:normTime(document.getElementById('psEn').value)||document.getElementById('psEn').value,brk:Number(document.getElementById('psBrk').value)||0};if(t.id!=='psName')render()}
  if(t.id==='fillShift')S.fill.shift=t.value;
  if(t.id==='fillWk')S.fill.skipWk=t.checked;
});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('tm')){e.target.select();setTimeout(()=>e.target.select(),0)}});
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('tm')){e.target.value=fmtTyping(e.target.value);return}if(e.target.id==='myNote'&&S.me){ensureDraft(S.me);S.draft.note=e.target.value;const sb=document.querySelector('[data-act="saveDraft"]');if(sb)sb.disabled=false}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='scrim'){if(e.target===b)closeModal();return}
  if(a==='close'){closeModal();return}
  if(a==='editMyShift'){const sh=myShifts(S.me).find(x=>x.id===b.dataset.id);if(!sh)return;S.addShift={editId:sh.id,orig:sh.name,name:sh.name,st:sh.start,en:sh.end,brk:sh.brk||0};render();setTimeout(()=>{const i=document.getElementById('psName');if(i){i.focus();i.select()}});return}
  if(a==='addMyShift'){S.addShift={name:'',st:'09:00',en:'13:00',brk:0};render();setTimeout(()=>{const i=document.getElementById('psName');if(i)i.focus()});return}
  if(a==='pickDept'){const sh=cfg().shifts.find(x=>x.id===b.dataset.id);if(!sh||!S.me)return;if(inMine(S.me,sh)){toast('已在我的常用班別');return}
    const item={id:'p'+Date.now().toString(36),fromId:sh.id,code:sh.code,name:sh.name,start:sh.start,end:sh.end,brk:sh.brk||0};
    if(await saveMyShifts(S.me,myShifts(S.me).concat(item))){S.addShift=null;if(S.tool==='s:'+sh.id)S.tool='s:'+item.id;render();toast('已把「'+sh.name+'」加入我的常用班別')}return}
  if(a==='cancelMyShift'){S.addShift=null;render();return}
  if(a==='saveMyShift'){const g=id=>document.getElementById(id).value;const name=g('psName').trim();if(!name){toast('請輸入班別名稱');return}
    const st=normTime(g('psSt')),en=normTime(g('psEn')),brk=Number(g('psBrk'))||0;if(!st||!en){toast('請輸入正確的上下班時間，例如 0830');return}if(st===en){toast('上下班時間不能相同');return}
    if(S.addShift&&S.addShift.editId){await updateMyShift(S.addShift.editId,{name,start:st,end:en,brk});return}
    const item={id:'p'+Date.now().toString(36),code:name.slice(0,2),name,start:st,end:en,brk};
    if(await saveMyShifts(S.me,myShifts(S.me).concat(item))){S.addShift=null;S.tool='s:'+item.id;render();toast('已新增「'+name+'」')}return}
  if(a==='mvMyShift'){const l=myShifts(S.me).slice(),i=l.findIndex(x=>x.id===b.dataset.id),j=i+Number(b.dataset.dir);if(i<0||j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];if(await saveMyShifts(S.me,l))render();return}
  if(a==='rmMyShift'){const id=b.dataset.id;if(!arm(b,'確認刪除'))return;if(await saveMyShifts(S.me,myShifts(S.me).filter(s=>s.id!==id))){if(S.tool==='s:'+id)S.tool=null;toast('已刪除常用班別，已排的班不受影響')}return}
  if(a==='tool'){S.tool=S.tool===b.dataset.v?null:b.dataset.v;render();return}
  const meS=()=>S.staff.find(s=>s.id===S.me);
  if(a==='day'){const me=meS();if(me&&!locked())applyDay(me,Number(b.dataset.d),e.shiftKey);return}
  if(a==='rmday'){const me=meS();if(me&&!locked())removeDay(me,Number(b.dataset.d));return}
  if(a==='saveDraft'){if(await flushDraft('draft'))toast('已暫存');return}
  if(a==='submit'){const ok=S.draft?await flushDraft('sent'):await saveDays(S.me,{},'sent');if(ok){render();toast('已送出給主管')}return}
  if(a==='reopen'){if(await saveDays(S.me,{},'draft'))toast('可以修改了，改完記得再送出');return}
  if(a==='clearAll'){if(!arm(b,'確認全部清除'))return;
    const me=meS();if(me)clearAll(me);return}
  if(a==='cell'){openCell(b.dataset.s,Number(b.dataset.d),e.shiftKey);return}
  if(a==='mset'&&modalCtx){const{sid,days}=modalCtx,v=b.dataset.v;let val;
    if(v==='clear')val=null;else if(v==='OFF'||v==='F')val={t:v};
    else if(v==='custom'){const st=document.getElementById('mSt').value,en=document.getElementById('mEn').value,br=Number(document.getElementById('mBrk').value)||0;val={t:'w',s:null,code:'自訂',st,en,h:hrs(st,en,br)}}
    else val=shiftEntry(shiftById(v.slice(2),sid));
    const p={};days.forEach(k=>p['d'+k]=val);const stp=S.staff.find(s=>s.id===sid);if(overCap(stp,p))return;withAutoOff(stp,p);closeModal();if(await saveDays(sid,p)&&days.length>1)toast(`已設定 ${days.length} 天`);return}
  if(a==='fill'){await fillEmpty();return}
  if(a==='mclear'){const stp=S.staff.find(s=>s.id===b.dataset.s);if(await saveDays(b.dataset.s,withAutoOff(stp,{['d'+b.dataset.d]:null})))toast('已清除');return}
  if(a==='mclearRow'){if(!arm(b,'確認清除？'))return;if(await saveDays(b.dataset.s,emptyPatch()))toast('已清除此人本月排班');return}
  if(a==='mclearAll'){if(!arm(b,'確認清除所有人？'))return;let n=0;for(const st of activeStaff()){if(S.sched[st.id]&&await saveDays(st.id,emptyPatch()))n++}toast(n?`已清除 ${n} 人的本月排班`:'本月沒有排班可清除');return}
  if(a==='lock'){const l=Object.assign({},cfg().locked||{});if(l[S.ym])delete l[S.ym];else l[S.ym]=true;if(await saveConfig({locked:l}))toast(l[S.ym]?'已鎖定':'已解除鎖定');return}
  if(a==='xlsx'){if(S.dl)exportXlsx(b);return}
  if(a==='addShift'){const sh=readShifts();sh.push({id:'s'+Date.now().toString(36),code:'新',name:'新班別',start:'09:00',end:'13:00',brk:0});S.config=Object.assign({},cfg(),{shifts:sh});render();toast('記得按「儲存班別」');return}
  if(a==='rmShift'){const sh=readShifts();sh.splice(Number(b.dataset.i),1);S.config=Object.assign({},cfg(),{shifts:sh});render();toast('記得按「儲存班別」');return}
  if(a==='saveShifts'){if(await saveConfig({shifts:readShifts()}))toast('班別已儲存');return}
  if(a==='saveStaffText'){const g=id=>document.getElementById(id).value;if(await saveConfig({staffTitle:g('cfSTitle').trim()||DEFAULT_CONFIG.staffTitle,staffSub:g('cfSSub').trim(),staffGuide:g('cfSGuide').trim()}))toast('人員畫面文字已儲存');return}
  if(a==='resetStaffText'){if(await saveConfig({staffTitle:DEFAULT_CONFIG.staffTitle,staffSub:DEFAULT_CONFIG.staffSub,staffGuide:''}))toast('已恢復預設文字');return}
  if(a==='saveCfg'){const g=id=>document.getElementById(id).value;
    if(await saveConfig({deptName:g('cfDept').trim(),deptCode:g('cfCode').trim(),title:g('cfTitle').trim(),rateBefore:Number(g('cfR1'))||0,rateAfter:Number(g('cfR2'))||0,monthCap:Number(g('cfCap'))||0,headNote:g('cfHead'),
      notes:g('cfNotes').split('\n').map(s=>s.trim()).filter(Boolean),signers:g('cfSign').split(/[、,，]/).map(s=>s.trim()).filter(Boolean)}))toast('已儲存');return}
  if(a==='saveStaff'){const tr=b.closest('tr'),g=n=>tr.querySelector(`[name=${n}]`);
    const st0=S.staff.find(x=>x.id===tr.dataset.sid);if(!st0)return;
    const data={code:st0.code,name:st0.name,lic:g('lic').value,licDate:g('licDate').value,active:g('active').checked};
    if(data.lic==='date'&&!data.licDate){toast('請填領照日');return}
    if(await saveStaff(tr.dataset.sid,data))toast('已儲存 '+data.name);return}
});

window.PTREFRESH=()=>{if(S.ready)render()}; // 預約系統的員工名單更新時由主頁呼叫
boot();
})();
</script>
