/* 我的加班費申請：讀取加班頁存在 ot 集合的資料（ot-form-v1:員編@民國年-月） */
const OT_T={A:"平日加班",B:"緊急來院加班",C:"休息日出勤"};
function myOT(code){
  const pre="ot-form-v1:"+code+"@",out=[];let rev={};
  const rd=otDocs.find(x=>x&&x.k==="ot-rev-v1");try{rev=rd?JSON.parse(rd.v)||{}:{}}catch(e){}
  otDocs.forEach(x=>{if(!x||typeof x.k!=="string"||x.k.indexOf(pre)!==0)return;
    const m=x.k.slice(pre.length).match(/^(\d+)-(\d+)$/);if(!m)return;let d;try{d=JSON.parse(x.v)}catch(e){return}
    const yr=+m[1]+1911,rv=(rev[m[1]+"-"+m[2]]||{})[(d&&d.h&&d.h.empid)||code];
    ((d&&d.rows)||[]).forEach(r=>{const dm=r&&String(r.date||"").match(/^(\d\d)\/(\d\d)$/);if(!dm)return;
      const sig=[r.date,r.os,r.oe,r.rs,r.re,r.type,r.norm,r.front,r.back,r.reason,r.tax].join("|"),st=rv?(rv.st?rv:rv[sig]):null;
      out.push({ot:1,k:x.k,sig,date:yr+"-"+dm[1]+"-"+dm[2],time:(r.os||"")+"-"+(r.oe||""),type:r.type,reason:r.reason||"",st:st&&st.st,note:st&&st.note})})});
  return out}
// 刪除一筆加班明細：改寫 ot 集合裡該月的文件（文件代號規則同 overtime.html 的 did()）
async function delOT(i){const o=otShown[i];if(!o||!store||!store.db)return;
  if(o.st==="ok"&&!user.admin)return notice("這筆加班費申請已審核通過，無法自行刪除，請洽管理者處理。");
  if(!await ask("確定刪除 "+dstr(o.date)+" "+o.time+" 這筆加班費申請？"+(o.st==="ok"?"（⚠ 這筆已審核通過）":"")))return;
  const x=otDocs.find(d=>d&&d.k===o.k);let d;try{d=JSON.parse(x.v)}catch(e){return flash("刪除失敗")}
  const sigOf=r=>[r.date,r.os,r.oe,r.rs,r.re,r.type,r.norm,r.front,r.back,r.reason,r.tax].join("|"),j=(d.rows||[]).findIndex(r=>sigOf(r)===o.sig);
  if(j<0)return flash("找不到這筆資料，可能已被刪除");d.rows.splice(j,1);
  const did="o"+o.k.replace(/[^A-Za-z0-9]/g,c=>"_"+c.charCodeAt(0).toString(16));
  try{await store.db.collection("ot").doc(did).set({k:o.k,v:JSON.stringify(d)});flash("已刪除")}catch(e){flash("刪除失敗，請稍後再試")}}

const nDim=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo,0).getDate()};
const nFirst=m=>{const[y,mo]=m.split("-").map(Number);return (new Date(y,mo-1,1).getDay()+6)%7};
const nDow=(m,d)=>{const[y,mo]=m.split("-").map(Number);return (new Date(y,mo-1,d).getDay()+6)%7};

const nShift=(m,k)=>{const[y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const nOpts=(()=>{const t=new Date();let y=t.getFullYear(),m=t.getMonth()+1;const o=[];for(let i=0;i<7;i++){o.push(y+"-"+pad(m));m++;if(m>12){m=1;y++}}return o})();

function nWorkOf(mk,c){const n=nDim(mk),w=new Set(),sc=nSchedAll[mk];
  if(sc){for(let d=1;d<=n;d++)if(!(sc[d]&&sc[d].has(c)))w.add(d)}
  else if(nAllAvail[mk]&&nAllAvail[mk][c])nAllAvail[mk][c].forEach(d=>w.add(d));
  return w}
function nExt(c,cur){const n=nDim(nMonth),P=nDim(nShift(nMonth,-1)),e=new Set(cur);
  nWorkOf(nShift(nMonth,-1),c).forEach(k=>e.add(k-P));nWorkOf(nShift(nMonth,1),c).forEach(k=>e.add(n+k));return e}
function nMaxRun(e,n){let m=0;for(let d=1;d<=n;d++)if(e.has(d))m=Math.max(m,nRun(e,d));return m}
function nSubscribe(){

    if(view==="night")render()},()=>{}));
}

  catch(e){nMsg="儲存失敗（"+((e&&e.code)||"error")+"）"+(e&&(e.code==="permission_denied"||e.code==="permission-denied")?"：沒有寫入權限":"，請稍後再試")}
  render()}
function nEdit(){if(nClosed){notice(NCLOSED);return}const me=nMeId();nEditing=true;nDirty=false;nMine=new Set(nAv()[me]||[]);nMsg="";render()}
function nCancel(){nResetMine();nMsg="";render()}
async function nToggleClose(){const v=!nClosed;try{await store.db.collection("config").doc("close_"+nMonth).set({closed:v,at:Date.now()});nClosed=v;nMsg=""}catch(e){nMsg="設定失敗，請稍後再試"}render()}
function nOffFromAvail(){const n=nDim(nMonth),av=nAv(),o={};for(let d=1;d<=n;d++)o[d]=new Set(nList().filter(c=>!(av[c]&&av[c].has(d))));return o}
function nBossToggle(c,d){
  nBossDirty=true;const s=nBoss[d]||(nBoss[d]=new Set());s.has(c)?s.delete(c):s.add(c);
  if(!s.has(c)){const w=new Set();for(let k=1;k<=nDim(nMonth);k++)if(!(nBoss[k]&&nBoss[k].has(c)))w.add(k);const L=nRun(nExt(c,w),d);if(L>=7)notice(nName(c)+" 已連續上"+L+"天班，請適當休息")}
  render()}
function nBossClear(){nBossDirty=false;nMsg="";render()}
async function nBossSave(){const o={};Object.keys(nBoss).forEach(d=>o[d]=[...nBoss[d]]);
  try{await store.db.collection("sched").doc(nMonth).set({month:nMonth,off:JSON.stringify(o),at:Date.now()});nMsg="✓ 班表已儲存"}catch(e){nMsg="儲存失敗，請稍後再試"}render()}
async function nCsv(){
  const n=nDim(nMonth),N=nList();const rows=[["日期","星期","OFF","上班"]];
  for(let d=1;d<=n;d++){const off=[...(nBoss[d]||[])];rows.push([nMonth+"-"+pad(d),"週"+NWD[nDow(nMonth,d)],off.map(nName).join("、"),N.filter(c=>!off.includes(c)).map(nName).join("、")])}
  const data="\ufeff"+rows.map(r=>r.map(x=>'"'+x+'"').join(",")).join("\n");
  try{const dl=await claude.use("downloads");if(dl)await dl.save({filename:"大夜班表_"+nMonth+".csv",data})}catch(e){}}
function nTable(off,editable){
  const N=nList(),n=nDim(nMonth),av=nAv();
  let h='<table class="ntbl"><tr><th>人員</th>';
  for(let d=1;d<=n;d++)h+=`<th class="${nWc(nDow(nMonth,d))}">${d}<br><span class="mut">${NWD[nDow(nMonth,d)]}</span></th>`;
  h+="<th>上班天數</th></tr>";
  N.forEach(c=>{let cnt=0;h+=`<tr><th>${esc(nName(c))}</th>`;
    for(let d=1;d<=n;d++){const o=(off[d]||new Set()).has(c);if(!o)cnt++;
      h+=`<td class="${editable?"nc":""} ${nWc(nDow(nMonth,d))}" ${editable?`onclick="nBossToggle('${c}',${d})"`:""}>${o?'<span class="mut">OFF</span>':"<b>F</b>"}</td>`}
    h+=`<td><b>${cnt}</b></td></tr>`});
  h+="<tr><th>當日上班人數</th>";
  for(let d=1;d<=n;d++){const k=N.length-(off[d]||new Set()).size;h+=`<td class="${k===2?"ngood":"nbad"}">${k}</td>`}
  return h+"<td></td></tr></table>"}
function nightAdminHtml(){
  if(!store||!store.db)return `<div class="card">目前無法連線資料庫（單機模式），大夜藥師排班需要連線資料庫才能使用。</div>`;
  nSubscribe();
  const N=nList(),n=nDim(nMonth),av=nAv();
  const sel=`<select onchange="nSetMonth(this.value)">${nOpts.map(o=>`<option value="${o}" ${o===nMonth?"selected":""}>${o.replace("-"," 年 ")} 月</option>`).join("")}</select>`;
  let h=`<div class="ns"><div class="card"><b>🌙 大夜藥師排班後台管理</b><div class="row" style="margin-top:8px;align-items:center"><span>月份：</span>${sel}<span class="mut">規則：每天 2 人上班，其餘 OFF</span></div></div>`;
    if(!nBossDirty)nBoss=nOffFromAvail();
    const bad=[];for(let d=1;d<=n;d++)if(N.length-(nBoss[d]||new Set()).size!==2)bad.push(d);
    const over=N.filter(c=>{const w=new Set();for(let k=1;k<=n;k++)if(!(nBoss[k]&&nBoss[k].has(c)))w.add(k);return nMaxRun(nExt(c,w),n)>=7});
    h+=`<div class="card"><b>填寫開關（依上方選擇的月份）</b><div class="row" style="margin-top:8px;align-items:center"><button class="sec" onclick="nToggleClose()">${nClosed?"🔓 重新開放填寫":"🚫 關閉填寫"}</button><span class="mut">${nClosed?"目前狀態：已關閉，同事無法填寫或修改":"目前狀態：開放填寫中"}</span></div></div>
    <div class="card"><b>班表（大家選的上班日）</b><p class="mut" style="margin:4px 0 8px">大夜班人員名單由「帳號管理」的班別決定（目前 ${N.length} 人）。表格預設依同事填寫的上班日顯示，同事存檔後會即時更新（F＝上班、OFF）；也可以直接點格子手動調整，調整後若想重新帶入最新填寫，請按「依同事填寫重設」。</p>
      <div class="row" style="margin:8px 0"><button class="sec" onclick="nBossClear()">依同事填寫重設</button><button onclick="nBossSave()">儲存班表</button><button class="sec" onclick="nCsv()">下載 CSV</button></div>
      <div class="scroll">${nTable(nBoss,true)}</div>
      <p class="mut">${bad.length?"⚠ 這些日子上班不是剛好 2 人："+bad.join("、")+" 日":"✓ 每天都剛好 2 人上班"}${over.length?"　⚠ 連續上班超過 6 天："+over.map(nName).join("、"):""}${nMsg?"　"+esc(nMsg):""}</p></div>`;
  h+=`<div class="card"><b>填寫狀況</b><div style="margin-top:8px">${N.map(c=>{const ok=!!av[c];return `<span class="ntag ${ok?"ok":"no"}">${esc(nName(c))}：${ok?"已填 "+av[c].size+" 天上班":"尚未填寫"}</span>`}).join("")||'<span class="mut">目前沒有大夜班人員（請到「帳號管理」設定班別）</span>'}</div></div>`;
  return h+"</div>"}
function nightView(){
  if(!nightAllowed()){setTimeout(()=>{view="form";render()},0);return ""}
  const head=`<div class="top"><div><b>🌙 大夜藥師排班系統</b></div><button class="sec" onclick="go('form')">其它假別預約畫面</button></div>`;
  if(!store||!store.db)return `<div class="ns">${head}<div class="card">目前無法連線資料庫（單機模式），大夜藥師排班需要連線資料庫才能使用。</div></div>`;
  nSubscribe();
  const me=nMeId(),N=nList(),n=nDim(nMonth),f=nFirst(nMonth),av=nAv();
  nTab="staff";
  const sel=`<select onchange="nSetMonth(this.value)">${nOpts.map(o=>`<option value="${o}" ${o===nMonth?"selected":""}>${o.replace("-"," 年 ")} 月</option>`).join("")}</select>`;
  let h=`<div class="ns">${head}<div class="card"><div class="row" style="align-items:center"><span>月份：</span>${sel}<span class="mut">規則：每天 2 人上班，其餘 OFF</span></div>
    </div>`;
  if(nTab==="staff"){
    let my;
    if(!me)my=`<div class="mut">你不在大夜班名單中，不需要填寫。可以在「後台管理」查看並調整班表。</div>`;
    else{
      const mine=nEditing?nMine:(av[me]||new Set());
      my=`<div class="mut" style="margin-bottom:6px">點選你<b>要上班</b>的日子（綠色＝要上班），再點一次取消，選好後按「存檔」。存檔後會鎖定，要更改請按「修改」。沒選的日子視為可以 OFF。</div>
      <div class="ncal">${NWD.map((w,i)=>`<div class="nhd ${nWc(i)}">${w}</div>`).join("")}${"<div></div>".repeat(f)}`;
      for(let d=1;d<=n;d++){const wk=mine.has(d);
        my+=`<button class="nday ${nWc(nDow(nMonth,d))} ${wk?"wk":""}" ${nEditing||nClosed?"":"disabled"} onclick="nToggle(${d})"><b>${d}</b><small>${wk?"要上班":""}</small></button>`}
      my+=`</div><p class="mut">已選 ${mine.size} 天要上班（平均每人一個月約上 ${Math.round(n*2/Math.max(N.length,1))} 天）　${nClosed?"🚫 本月填寫已關閉":nEditing?"✏️ 編輯中，尚未存檔":"🔒 已存檔"}</p>
      <div class="row">${nEditing?`<button onclick="nSave()">💾 存檔</button>${av[me]?`<button class="sec" onclick="nCancel()">取消修改</button>`:""}`:`<button class="sec" onclick="nEdit()">✏️ 修改</button>`}</div>`}
    const eff=c=>(c===me&&nEditing)?nMine:av[c];const req={};for(let d=1;d<=n;d++)req[d]=new Set(N.filter(c=>!(eff(c)&&eff(c).has(d))));
    h+=`<div class="card"><b>填寫人：${me?esc(nName(me))+"（"+me+"）":esc(callName(user))}</b>${my}${nMsg?`<p class="mut">${esc(nMsg)}</p>`:""}</div>
    <div class="card"><b>大家選的上班日（即時更新）</b><p class="mut" style="margin:4px 0 8px">預設為 OFF，同事選了要上班的日子會改成 F，你點選中、還沒存檔的日子也會馬上顯示在下表，可以參考其他人的狀況再決定自己的日子。</p><div class="scroll">${nTable(req,false)}</div></div>
    <div class="card"><b>填寫狀況</b><div style="margin-top:8px">${N.map(c=>{const ok=!!av[c];return `<span class="ntag ${ok?"ok":"no"}">${esc(nName(c))}：${ok?"已填 "+av[c].size+" 天上班":"尚未填寫"}</span>`}).join("")||'<span class="mut">目前沒有大夜班人員（請到後台「帳號管理」設定班別）</span>'}</div></div>`;
  }
  return h+"</div>"}

init();
</script>
